# Firebase App Hosting configuration for the production Vynq-chat backend.
# Firebase web configuration is public by design; access is enforced by
# Firebase Authentication, App Check, and the deployed Security Rules.
runConfig:
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDsTehIbIV6U0WxcteI_1MGwZFYbEu8XDU"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "vynq-chat.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: "https://vynq-chat-default-rtdb.firebaseio.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "vynq-chat"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "vynq-chat.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "998442115242"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:998442115242:web:aa828d98187391404e30d3"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-2J4TC3XP7B"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION
    value: "us-central1"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_ENABLE_FIREBASE_APP_CHECK
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
